services:
  # Backend API + BullMQ Worker Web Service
  - type: web
    name: reachinbox-scheduler-backend
    runtime: node
    plan: free
    region: oregon
    rootDir: backend
    buildCommand: npm install && npx prisma generate && npx prisma migrate deploy && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: reachinbox-db
          property: connectionString
      - key: REDIS_URL
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: DELAY_BETWEEN_EMAILS_MS
        value: 2000

databases:
  # Free PostgreSQL Database on Render
  - name: reachinbox-db
    plan: free
    region: oregon
    databaseName: reachinbox_db
    user: reachinbox_user
