version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: reachinbox_prod_postgres
    restart: always
    environment:
      POSTGRES_USER: reachinbox_user
      POSTGRES_PASSWORD: reachinbox_secure_password
      POSTGRES_DB: reachinbox_db
    ports:
      - '5432:5432'
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U reachinbox_user -d reachinbox_db']
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: reachinbox_prod_redis
    restart: always
    ports:
      - '6379:6379'
    volumes:
      - redis_prod_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 5

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.0
    container_name: reachinbox_prod_elasticsearch
    restart: always
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ports:
      - '9200:9200'
    volumes:
      - es_prod_data:/usr/share/elasticsearch/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: reachinbox_prod_backend
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      PORT: 5000
      DATABASE_URL: postgresql://reachinbox_user:reachinbox_secure_password@postgres:5432/reachinbox_db?schema=public
      REDIS_URL: redis://redis:6379
      ELASTICSEARCH_NODE: http://elasticsearch:9200
      FRONTEND_URL: http://localhost:3000
    ports:
      - '5000:5000'

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:5000
        NEXT_PUBLIC_GOOGLE_CLIENT_ID: 644429249211-dbfs7ul318qnniaft4p46nq4d5c1svon.apps.googleusercontent.com
    container_name: reachinbox_prod_frontend
    restart: always
    depends_on:
      - backend
    ports:
      - '3000:3000'

volumes:
  postgres_prod_data:
  redis_prod_data:
  es_prod_data:
